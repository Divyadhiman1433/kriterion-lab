[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kriterion-ml-lab"
version = "0.1.0"
description = "An auditable clinical machine-learning study comparing feature selection and scratch optimization methods."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Divya" }
]
keywords = [
  "machine-learning",
  "feature-selection",
  "linear-regression",
  "logistic-regression",
  "streamlit",
  "education"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "streamlit>=1.40,<2"
]

[project.optional-dependencies]
dev = [
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/kriterion"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["kriterion"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

